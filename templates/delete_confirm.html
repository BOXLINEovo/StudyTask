{% extends "base.html" %}
{% block title %}删除任务 · StudyTask{% endblock %}
{% block content %}
<div class="form-card narrow">
  <h1>确认删除</h1>
  <p>确定要删除任务 <strong>{{ task.name }}</strong>（{{ task.course }}）吗？删除后不可恢复。</p>
  <form method="post" action="{{ url_for('delete_task', task_id=task.id) }}">
    <div class="form-actions">
      <button class="btn danger" type="submit">确认删除</button>
      <a class="btn" href="{{ url_for('index') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
